<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121a">
  <title>Die Chroniken von Eldoria</title>
  <link rel="stylesheet" href="fonts/schriften.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/thema3d.css">
</head>
<body>
  <header id="hud" hidden>
    <div class="hud-held">
      <img id="hud-bild" alt="">
      <div>
        <div id="hud-name">–</div>
        <div id="hud-stufe">Stufe 1</div>
        <div id="hud-herzen" title="Deine Herzen"></div>
      </div>
    </div>
    <div class="hud-xp" title="Erfahrungspunkte">
      <div class="xp-balken"><div id="hud-xp-fuellung"></div></div>
      <div id="hud-xp-text">0 XP</div>
    </div>
    <div id="hud-reich" title="Hier bist du gerade"></div>
    <nav class="hud-knoepfe">
      <button data-aktion="ziele" title="Aufgaben (Q)">📋 <span>Aufgaben</span></button>
      <button data-aktion="inventar" title="Inventar (I)">🎒 <span>Inventar</span></button>
      <button data-aktion="heldenpass" title="Heldenpass (P)">🪪 <span>Heldenpass</span></button>
      <button data-aktion="menue" title="Menü (Esc)">☰ <span>Menü</span></button>
    </nav>
  </header>

  <main id="buehne">
    <div id="spiel"></div>
    <div id="hinweis" hidden></div>
  </main>

  <div id="overlay" hidden>
    <div id="fenster" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="src/main3d.js"></script>
</body>
</html>
